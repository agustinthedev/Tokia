name: Codex issue implementation

on:
  issues:
    types: [labeled]

jobs:
  gate:
    name: Accept an implementation request
    if: github.event.issue.pull_request == null && github.event.label.name == 'status:accepted'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      run_implementation: ${{ steps.prepare.outputs.run_implementation }}
      branch_name: ${{ steps.prepare.outputs.branch_name }}
    steps:
      - name: Validate the issue and update its status
        id: prepare
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const branchName = `codex/issue-${issueNumber}`;

            const issueResponse = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const issue = issueResponse.data;
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            core.setOutput('branch_name', branchName);
            core.setOutput('run_implementation', 'false');

            if (issue.state !== 'open') {
              core.info('The issue is not open; skipping implementation.');
              return;
            }

            if (!labels.includes('source:codex')) {
              core.info('The issue was not generated by Codex; skipping implementation.');
              return;
            }

            const existingPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`,
                per_page: 100,
              },
            );

            if (existingPullRequests.length > 0) {
              core.info(`An open implementation PR already exists: #${existingPullRequests[0].number}`);
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'status:in-development',
                color: '1D76DB',
                description: 'Accepted and currently being implemented',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const statusLabels = new Set([
              'status:proposed',
              'status:accepted',
              'status:in-development',
            ]);
            const nextLabels = labels.filter((label) => !statusLabels.has(label));
            nextLabels.push('status:in-development');

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: nextLabels,
            });

            core.setOutput('run_implementation', 'true');
            core.notice(`Accepted issue #${issueNumber} for implementation on ${branchName}.`);

  implement:
    name: Implement the issue with Codex
    needs: gate
    if: needs.gate.outputs.run_implementation == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: codex-issue-implementation
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.finalize.outputs.has_changes }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
    env:
      BRANCH_NAME: ${{ needs.gate.outputs.branch_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git and prepare the implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH_NAME}"
            git switch --track -c "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          else
            git switch -c "${BRANCH_NAME}" origin/master
          fi

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Build the implementation context prompt
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const issue = context.payload.issue || {};

            function clip(value, limit) {
              const text = String(value || '');
              if (text.length <= limit) return text;
              return `${text.slice(0, limit)}\n\n[Content truncated for context size.]`;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );

            const recentComments = comments.slice(-50);
            const thread = recentComments.length === 0
              ? '(No comments were found.)'
              : recentComments.map((comment) => [
                  `### @${comment.user?.login || 'unknown'} (${comment.created_at})`,
                  clip(comment.body, 12000),
                ].join('\n')).join('\n\n');

            const labels = (issue.labels || [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .join(', ');

            const prompt = [
              fs.readFileSync('.github/codex/prompts/issue-implementation.md', 'utf8').trim(),
              '',
              '## Accepted issue context',
              `Issue: #${issueNumber}`,
              `Title: ${clip(issue.title, 500)}`,
              `Labels: ${labels || '(none)'}`,
              '',
              '### Issue body',
              clip(issue.body || '(empty)', 24000),
              '',
              '## Recent comment thread',
              thread,
            ].join('\n');

            fs.mkdirSync('.github/codex/runtime', { recursive: true });
            fs.writeFileSync('.github/codex/runtime/issue-implementation.md', `${prompt}\n`, 'utf8');
            core.info(`Prepared context from ${recentComments.length} recent issue comment(s).`);

      - name: Run Codex implementation
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-terra
          effort: medium
          prompt-file: .github/codex/runtime/issue-implementation.md
          output-file: .github/codex/runtime/issue-implementation-output.json
          codex-args: >-
            ["--output-schema", ".github/codex/schemas/issue-implementation.json"]
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Create commits, validate, and push the implementation branch
        id: finalize
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          output_file="${RUNNER_TEMP}/codex-implementation-output.json"
          summary_file="${RUNNER_TEMP}/codex-implementation-report.md"
          commit_summary_file="${RUNNER_TEMP}/codex-implementation-commits.md"

          if [[ -f .github/codex/runtime/issue-implementation-output.json ]]; then
            cp .github/codex/runtime/issue-implementation-output.json "${output_file}"
          else
            printf '%s\n' '{}' > "${output_file}"
          fi

          rm -rf .github/codex/runtime

          CODEX_OUTPUT_FILE="${output_file}" \
          SUMMARY_FILE="${summary_file}" \
          COMMIT_SUMMARY_FILE="${commit_summary_file}" \
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { execFileSync } = require('child_process');

          function git(args, options = {}) {
            const result = execFileSync('git', args, {
              encoding: 'utf8',
              ...options,
            });
            return typeof result === 'string' ? result.trim() : '';
          }

          function fail(message) {
            throw new Error(message);
          }

          function requireString(value, label) {
            if (typeof value !== 'string' || value.trim() === '') {
              fail(`${label} must be a non-empty string.`);
            }
            return value.trim();
          }

          const outputPath = process.env.CODEX_OUTPUT_FILE;
          let output;
          try {
            output = JSON.parse(fs.readFileSync(outputPath, 'utf8'));
          } catch (error) {
            fail(`Codex output is missing or is not valid JSON: ${error.message}`);
          }

          if (!output || typeof output !== 'object' || Array.isArray(output)) {
            fail('Codex output must be a JSON object.');
          }

          const implementationSummary = requireString(
            output.implementation_summary,
            'implementation_summary',
          );
          if (!Array.isArray(output.commits)) fail('commits must be an array.');
          if (!Array.isArray(output.checks)) fail('checks must be an array.');
          if (!Array.isArray(output.limitations)) fail('limitations must be an array.');

          const changedFiles = [...new Set([
            ...git(['diff', '--name-only']).split('\n'),
            ...git(['diff', '--cached', '--name-only']).split('\n'),
            ...git(['ls-files', '--others', '--exclude-standard']).split('\n'),
          ].filter(Boolean))].sort();
          const changedSet = new Set(changedFiles);
          const assignedFiles = new Set();
          const conventionalCommit = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()\n]+\))?: [^\n]+$/;

          for (const [index, commit] of output.commits.entries()) {
            if (!commit || typeof commit !== 'object' || Array.isArray(commit)) {
              fail(`commits[${index}] must be an object.`);
            }

            const message = requireString(commit.message, `commits[${index}].message`);
            if (!conventionalCommit.test(message)) {
              fail(`commits[${index}].message is not a conventional commit subject: ${message}`);
            }
            if (!Array.isArray(commit.files) || commit.files.length === 0) {
              fail(`commits[${index}].files must contain at least one file.`);
            }
            if (typeof commit.expected_failure !== 'boolean') {
              fail(`commits[${index}].expected_failure must be a boolean.`);
            }
            if (commit.expected_failure && !message.startsWith('test')) {
              fail(`commits[${index}] marks a non-test commit as an expected failure.`);
            }
            if (commit.expected_failure && !requireString(
              commit.failure_reason,
              `commits[${index}].failure_reason`,
            )) {
              fail(`commits[${index}].failure_reason is required for an expected failure.`);
            }
            if (commit.expected_failure && index === output.commits.length - 1) {
              fail(`commits[${index}] is expected to fail but has no later implementation commit.`);
            }

            for (const file of commit.files) {
              requireString(file, `commits[${index}].files entry`);
              if (path.isAbsolute(file) || path.posix.normalize(file).startsWith('../')) {
                fail(`Commit plan contains a path outside the repository: ${file}`);
              }
              if (!changedSet.has(file)) {
                fail(`Commit plan references a file that Codex did not change: ${file}`);
              }
              if (assignedFiles.has(file)) {
                fail(`File appears in more than one commit group: ${file}`);
              }
              assignedFiles.add(file);
            }
          }

          for (const file of changedFiles) {
            if (file === '.github/codex/runtime/issue-implementation-output.json') continue;
            if (/^(\.env|\.env\.(local|development|production))$/.test(file)
              || /\.(pem|key|p12|pfx)$/.test(file)) {
              fail(`Refusing to commit sensitive-looking file: ${file}`);
            }
            if (!assignedFiles.has(file)) {
              fail(`Changed file is missing from the commit plan: ${file}`);
            }
          }

          if (assignedFiles.size !== changedFiles.length) {
            fail('The commit plan does not account for every changed file.');
          }

          for (const [index, commit] of output.commits.entries()) {
            const args = ['add', '--', ...commit.files];
            git(args, { stdio: 'inherit' });
            git(['diff', '--cached', '--check'], { stdio: 'inherit' });

            const commitArgs = ['commit', '-m', commit.message];
            if (commit.expected_failure) {
              commitArgs.push(
                '-m',
                [
                  'This test-first commit is intentionally expected to fail until a subsequent implementation commit.',
                  commit.failure_reason.trim(),
                ].join(' '),
              );
            }
            git(commitArgs, { stdio: 'inherit' });
          }

          if (git(['status', '--porcelain'])) {
            git(['status', '--short'], { stdio: 'inherit' });
            fail('The runner could not commit every intentional change.');
          }

          const markdown = [
            '## Implementation summary',
            implementationSummary,
            '',
            '## Checks',
            output.checks.length > 0
              ? output.checks.map((check) => {
                  const name = requireString(check?.name, 'check.name');
                  const status = requireString(check?.status, `check ${name} status`);
                  const details = typeof check.details === 'string' && check.details.trim()
                    ? ` - ${check.details.trim()}`
                    : '';
                  return `- **${status}**: ${name}${details}`;
                }).join('\n')
              : '- No checks were reported.',
            '',
            '## Limitations',
            output.limitations.length > 0
              ? output.limitations.map((limitation) => `- ${requireString(limitation, 'limitation')}`).join('\n')
              : '- None reported.',
          ].join('\n');
          fs.writeFileSync(process.env.SUMMARY_FILE, `${markdown}\n`, 'utf8');

          const commitSummary = git(['log', '--reverse', '--format=- `%h` %s%n%b', 'origin/master..HEAD']);
          fs.writeFileSync(
            process.env.COMMIT_SUMMARY_FILE,
            `${commitSummary || 'No implementation commits were created.'}\n`,
            'utf8',
          );
          NODE

          commit_count="$(git rev-list --count origin/master..HEAD)"
          if [[ "${commit_count}" -eq 0 ]]; then
            printf 'has_changes=false\n' >> "${GITHUB_OUTPUT}"
            printf 'summary_file=%s\n' "${summary_file}" >> "${GITHUB_OUTPUT}"
            printf 'commit_summary_file=%s\n' "${commit_summary_file}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --check origin/master...HEAD

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${BRANCH_NAME}"

          printf 'has_changes=true\n' >> "${GITHUB_OUTPUT}"
          printf 'summary_file=%s\n' "${summary_file}" >> "${GITHUB_OUTPUT}"
          printf 'commit_summary_file=%s\n' "${commit_summary_file}" >> "${GITHUB_OUTPUT}"

      - name: Create the implementation pull request
        id: create_pr
        if: steps.finalize.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          SUMMARY_FILE: ${{ steps.finalize.outputs.summary_file }}
          COMMIT_SUMMARY_FILE: ${{ steps.finalize.outputs.commit_summary_file }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const branchName = process.env.BRANCH_NAME;
            const summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8').trim();
            const commitSummary = fs.readFileSync(process.env.COMMIT_SUMMARY_FILE, 'utf8').trim();
            const marker = `<!-- codex-implementation-pr:${issueNumber} -->`;

            const existingPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`,
                per_page: 100,
              },
            );

            const currentIssueResponse = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const currentIssue = currentIssueResponse.data;

            const typeLabel = (currentIssue.labels || [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .find((label) => label?.startsWith('type:'))
              ?.slice('type:'.length);
            const titlePrefix = {
              bug: 'fix',
              security: 'fix(security)',
              'tech-debt': 'refactor',
              product: 'feat',
            }[typeLabel] || 'chore';

            const labelsToPropagate = [...new Set(
              (currentIssue.labels || [])
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter((label) => label && !label.startsWith('status:')),
            )];

            let pullRequest = existingPullRequests[0];
            if (!pullRequest) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                head: branchName,
                base: 'master',
                title: `${titlePrefix}: ${String(currentIssue.title || 'implement accepted issue').trim()}`.slice(0, 256),
                body: [
                  '## Summary',
                  `Implements #${issueNumber}.`,
                  '',
                  '## Codex implementation report',
                  summary || 'No implementation report was returned.',
                  '',
                  '## Commits',
                  commitSummary || 'No commit summary was returned.',
                  '',
                  '## Notes',
                  'This pull request was generated after the issue received the `status:accepted` label.',
                  '',
                  `Closes #${issueNumber}`,
                  `<!-- codex-implementation-run: ${context.runId} -->`,
                ].join('\n'),
                maintainer_can_modify: true,
              });
              pullRequest = response.data;
            } else {
              core.info(`An open implementation PR already exists: #${pullRequest.number}`);
            }

            if (labelsToPropagate.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  labels: labelsToPropagate,
                });
                core.info(`Propagated labels to implementation PR: ${labelsToPropagate.join(', ')}`);
              } catch (error) {
                if (error?.status === 404 || error?.status === 422) {
                  core.warning(`The implementation PR was created, but its labels could not be propagated: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );

            if (!comments.some((comment) => comment.user?.type === 'Bot' && comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  marker,
                  `Codex implemented this issue and opened [PR #${pullRequest.number}](${pullRequest.html_url}) for review.`,
                ].join('\n'),
              });
            }

            core.setOutput('pr_url', pullRequest.html_url);
            core.notice(`Implementation PR: ${pullRequest.html_url}`);

      - name: Report that no implementation was created
        if: steps.finalize.outputs.has_changes != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const marker = '<!-- codex-implementation-no-changes -->';
            const currentIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const isOpen = currentIssue.data.state === 'open';

            if (isOpen) {
              const currentLabels = currentIssue.data.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean);
              const implementationStatuses = new Set([
                'status:proposed',
                'status:in-development',
              ]);

              if (currentLabels.includes('status:in-development')) {
                const nextLabels = currentLabels.filter((label) => !implementationStatuses.has(label));
                nextLabels.push('status:proposed');

                await github.rest.issues.setLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: nextLabels,
                });
              }
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            const hasExistingReport = comments.some(
              (comment) => comment.user?.type === 'Bot'
                && comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes(marker),
            );

            if (!hasExistingReport) {
              const message = isOpen
                ? 'Codex did not create implementation commits for this accepted issue. The issue was returned to `status:proposed`; review the workflow logs and refine the issue before accepting it again.'
                : 'Codex did not create implementation commits, and the issue is already closed, so no implementation pull request was created.';

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [marker, message].join('\n'),
              });
            }

            core.warning(`No implementation commits were created for issue #${issueNumber}; issue state: ${currentIssue.data.state}.`);

  notify_failure:
    name: Report implementation failure
    needs: implement
    if: ${{ always() && needs.implement.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const marker = `<!-- codex-implementation-failure:${context.runId} -->`;
            const currentIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const isOpen = currentIssue.data.state === 'open';

            if (isOpen) {
              const currentLabels = currentIssue.data.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean);
              const implementationStatuses = new Set([
                'status:proposed',
                'status:in-development',
              ]);

              if (currentLabels.includes('status:in-development')) {
                const nextLabels = currentLabels.filter((label) => !implementationStatuses.has(label));
                nextLabels.push('status:proposed');

                await github.rest.issues.setLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: nextLabels,
                });
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                marker,
                `Codex could not complete the implementation workflow. Review the [workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) before retrying.`,
                isOpen
                  ? 'The issue was returned to `status:proposed`.'
                  : 'The issue is already closed, so its labels were left unchanged.',
              ].join('\n'),
            });
