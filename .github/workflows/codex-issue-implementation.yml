name: Codex issue implementation

on:
  issues:
    types: [labeled]

jobs:
  gate:
    name: Accept an implementation request
    if: github.event.issue.pull_request == null && github.event.label.name == 'status:accepted'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      run_implementation: ${{ steps.prepare.outputs.run_implementation }}
      branch_name: ${{ steps.prepare.outputs.branch_name }}
      issue_type: ${{ steps.prepare.outputs.issue_type }}
    steps:
      - name: Validate the issue and update its status
        id: prepare
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const branchName = `codex/issue-${issueNumber}`;

            const issueResponse = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const issue = issueResponse.data;
            const labels = issue.labels.map((label) => typeof label === 'string' ? label : label.name);
            const issueType = labels.find((label) => label?.startsWith('type:'))?.slice('type:'.length) || 'general';

            core.setOutput('branch_name', branchName);
            core.setOutput('run_implementation', 'false');
            core.setOutput('issue_type', issueType);

            if (issue.state !== 'open') {
              core.info('The issue is not open; skipping implementation.');
              return;
            }

            if (!labels.includes('source:codex')) {
              core.info('The issue was not generated by Codex; skipping implementation.');
              return;
            }

            const existingPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`,
                per_page: 100,
              },
            );

            if (existingPullRequests.length > 0) {
              core.info(`An open implementation PR already exists: #${existingPullRequests[0].number}`);
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'status:in-development',
                color: '1D76DB',
                description: 'Accepted and currently being implemented',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const statusLabels = new Set([
              'status:proposed',
              'status:accepted',
              'status:in-development',
            ]);
            const nextLabels = labels.filter((label) => !statusLabels.has(label));
            nextLabels.push('status:in-development');

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: nextLabels,
            });

            core.setOutput('run_implementation', 'true');
            core.notice(`Accepted issue #${issueNumber} for implementation on ${branchName}.`);

  implement:
    name: Implement the issue with Codex
    needs: gate
    if: needs.gate.outputs.run_implementation == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: codex-issue-implementation
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.finalize.outputs.has_changes }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
    env:
      BRANCH_NAME: ${{ needs.gate.outputs.branch_name }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TYPE: ${{ needs.gate.outputs.issue_type }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git and prepare the implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH_NAME}"
            git switch --track -c "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          else
            git switch -c "${BRANCH_NAME}" origin/master
          fi

      - name: Install repository dependencies
        shell: bash
        run: npm ci

      - name: Build the implementation context prompt
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const issue = context.payload.issue || {};

            function clip(value, limit) {
              const text = String(value || '');
              if (text.length <= limit) return text;
              return `${text.slice(0, limit)}\n\n[Content truncated for context size.]`;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );

            const recentComments = comments.slice(-50);
            const thread = recentComments.length === 0
              ? '(No comments were found.)'
              : recentComments.map((comment) => [
                  `### @${comment.user?.login || 'unknown'} (${comment.created_at})`,
                  clip(comment.body, 12000),
                ].join('\n')).join('\n\n');

            const labels = (issue.labels || [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .filter(Boolean)
              .join(', ');

            const prompt = [
              fs.readFileSync('.github/codex/prompts/issue-implementation.md', 'utf8').trim(),
              '',
              '## Accepted issue context',
              `Issue: #${issueNumber}`,
              `Title: ${clip(issue.title, 500)}`,
              `Labels: ${labels || '(none)'}`,
              '',
              '### Issue body',
              clip(issue.body || '(empty)', 24000),
              '',
              '## Recent comment thread',
              thread,
            ].join('\n');

            fs.mkdirSync('.github/codex/runtime', { recursive: true });
            fs.writeFileSync('.github/codex/runtime/issue-implementation.md', `${prompt}\n`, 'utf8');
            core.info(`Prepared context from ${recentComments.length} recent issue comment(s).`);

      - name: Run Codex implementation
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/runtime/issue-implementation.md
          output-file: .github/codex/runtime/issue-implementation-output.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Create commits, validate, and push the implementation branch
        id: finalize
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          summary_file="${RUNNER_TEMP}/codex-implementation-report.md"
          if [[ -f .github/codex/runtime/issue-implementation-output.md ]]; then
            cp .github/codex/runtime/issue-implementation-output.md "${summary_file}"
          else
            printf '%s\n' 'Codex did not produce an implementation report.' > "${summary_file}"
          fi

          rm -rf .github/codex/runtime

          mapfile -t changed_files < <(
            {
              git diff --name-only
              git diff --cached --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          if ((${#changed_files[@]} > 0)); then
            for file in "${changed_files[@]}"; do
              case "${file}" in
                .env|.env.local|.env.development|.env.production|*.pem|*.key|*.p12|*.pfx)
                  echo "Refusing to commit sensitive-looking file: ${file}" >&2
                  exit 1
                  ;;
              esac
            done

            test_files=()
            implementation_files=()
            for file in "${changed_files[@]}"; do
              case "${file}" in
                *.test.*|*.spec.*|tests/*|*/tests/*)
                  test_files+=("${file}")
                  ;;
                *)
                  implementation_files+=("${file}")
                  ;;
              esac
            done

            scope="$(printf '%s' "${ISSUE_TYPE:-general}" | tr -c '[:alnum:]-' '-' | sed 's/-*$//')"
            [[ -n "${scope}" ]] || scope='general'
            case "${ISSUE_TYPE:-general}" in
              product) implementation_prefix='feat' ;;
              tech-debt) implementation_prefix='refactor' ;;
              bug|security) implementation_prefix='fix' ;;
              *) implementation_prefix='chore' ;;
            esac

            if ((${#test_files[@]} > 0)); then
              git add -- "${test_files[@]}"
              git diff --cached --check
              git commit -m "test(${scope}): add coverage for issue #${ISSUE_NUMBER}"
            fi

            if ((${#implementation_files[@]} > 0)); then
              git add -- "${implementation_files[@]}"
              git diff --cached --check
              git commit -m "${implementation_prefix}(${scope}): implement issue #${ISSUE_NUMBER}"
            fi

            if [[ -n "$(git status --porcelain)" ]]; then
              echo 'The runner could not commit every intentional change.' >&2
              git status --short >&2
              exit 1
            fi
          fi

          commit_count="$(git rev-list --count origin/master..HEAD)"
          if [[ "${commit_count}" -eq 0 ]]; then
            echo 'Codex did not create any implementation commits.' >&2
            printf 'has_changes=false\n' >> "${GITHUB_OUTPUT}"
            printf 'summary_file=%s\n' "${summary_file}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --check origin/master...HEAD
          commit_summary_file="${RUNNER_TEMP}/codex-implementation-commits.md"
          git log --reverse --format='- `%h` %s' origin/master..HEAD > "${commit_summary_file}"

          auth_header="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w 0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push origin "HEAD:${BRANCH_NAME}"

          printf 'has_changes=true\n' >> "${GITHUB_OUTPUT}"
          printf 'summary_file=%s\n' "${summary_file}" >> "${GITHUB_OUTPUT}"
          printf 'commit_summary_file=%s\n' "${commit_summary_file}" >> "${GITHUB_OUTPUT}"

      - name: Create the implementation pull request
        id: create_pr
        if: steps.finalize.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ env.BRANCH_NAME }}
          SUMMARY_FILE: ${{ steps.finalize.outputs.summary_file }}
          COMMIT_SUMMARY_FILE: ${{ steps.finalize.outputs.commit_summary_file }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const issue = context.payload.issue || {};
            const branchName = process.env.BRANCH_NAME;
            const summary = fs.readFileSync(process.env.SUMMARY_FILE, 'utf8').trim();
            const commitSummary = fs.readFileSync(process.env.COMMIT_SUMMARY_FILE, 'utf8').trim();
            const marker = `<!-- codex-implementation-pr:${issueNumber} -->`;

            const existingPullRequests = await github.paginate(
              github.rest.pulls.list,
              {
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`,
                per_page: 100,
              },
            );

            const typeLabel = (issue.labels || [])
              .map((label) => typeof label === 'string' ? label : label.name)
              .find((label) => label?.startsWith('type:'))
              ?.slice('type:'.length);
            const titlePrefix = {
              bug: 'fix',
              security: 'fix(security)',
              'tech-debt': 'refactor',
              product: 'feat',
            }[typeLabel] || 'chore';

            let pullRequest = existingPullRequests[0];
            if (!pullRequest) {
              const response = await github.rest.pulls.create({
                owner,
                repo,
                head: branchName,
                base: 'master',
                title: `${titlePrefix}: ${String(issue.title || 'implement accepted issue').trim()}`.slice(0, 256),
                body: [
                  '## Summary',
                  `Implements #${issueNumber}.`,
                  '',
                  '## Codex implementation report',
                  summary || 'No implementation report was returned.',
                  '',
                  '## Commits',
                  commitSummary || 'No commit summary was returned.',
                  '',
                  '## Notes',
                  'This pull request was generated after the issue received the `status:accepted` label.',
                  '',
                  `Closes #${issueNumber}`,
                  `<!-- codex-implementation-run: ${context.runId} -->`,
                ].join('\n'),
                maintainer_can_modify: true,
              });
              pullRequest = response.data;
            } else {
              core.info(`An open implementation PR already exists: #${pullRequest.number}`);
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );

            if (!comments.some((comment) => comment.user?.type === 'Bot' && comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  marker,
                  `Codex implemented this issue and opened [PR #${pullRequest.number}](${pullRequest.html_url}) for review.`,
                ].join('\n'),
              });
            }

            core.setOutput('pr_url', pullRequest.html_url);
            core.notice(`Implementation PR: ${pullRequest.html_url}`);

      - name: Report that no implementation was created
        if: steps.finalize.outputs.has_changes != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const marker = '<!-- codex-implementation-no-changes -->';
            const currentIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const isOpen = currentIssue.data.state === 'open';

            if (isOpen) {
              const currentLabels = currentIssue.data.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean);
              const implementationStatuses = new Set([
                'status:proposed',
                'status:in-development',
              ]);

              if (currentLabels.includes('status:in-development')) {
                const nextLabels = currentLabels.filter((label) => !implementationStatuses.has(label));
                nextLabels.push('status:proposed');

                await github.rest.issues.setLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: nextLabels,
                });
              }
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            const hasExistingReport = comments.some(
              (comment) => comment.user?.type === 'Bot'
                && comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes(marker),
            );

            if (!hasExistingReport) {
              const message = isOpen
                ? 'Codex did not create implementation commits for this accepted issue. The issue was returned to `status:proposed`; review the workflow logs and refine the issue before accepting it again.'
                : 'Codex did not create implementation commits, and the issue is already closed, so no implementation pull request was created.';

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [marker, message].join('\n'),
              });
            }

            core.warning(`No implementation commits were created for issue #${issueNumber}; issue state: ${currentIssue.data.state}.`);

  notify_failure:
    name: Report implementation failure
    needs: implement
    if: ${{ always() && needs.implement.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const marker = `<!-- codex-implementation-failure:${context.runId} -->`;
            const currentIssue = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            });
            const isOpen = currentIssue.data.state === 'open';

            if (isOpen) {
              const currentLabels = currentIssue.data.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean);
              const implementationStatuses = new Set([
                'status:proposed',
                'status:in-development',
              ]);

              if (currentLabels.includes('status:in-development')) {
                const nextLabels = currentLabels.filter((label) => !implementationStatuses.has(label));
                nextLabels.push('status:proposed');

                await github.rest.issues.setLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: nextLabels,
                });
              }
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                marker,
                `Codex could not complete the implementation workflow. Review the [workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) before retrying.`,
                isOpen
                  ? 'The issue was returned to `status:proposed`.'
                  : 'The issue is already closed, so its labels were left unchanged.',
              ].join('\n'),
            });
