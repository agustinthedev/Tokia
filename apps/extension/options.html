<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokia settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="options">
  <main>
    <header class="brand-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><img src="tokia-rocket.svg" alt=""></span>
        <span class="brand-copy"><strong>Tokia</strong><small>Local workspace</small></span>
      </div>
      <span class="eyebrow">Extension settings</span>
    </header>

    <section class="intro">
      <p class="eyebrow">Configuration</p>
      <h1>Connect your workspace</h1>
      <p>Set the local API connection and scanning preferences for the Pinterest importer.</p>
    </section>

    <form>
      <fieldset>
        <legend>Connection</legend>
        <label>Backend URL<input id="backend-url" type="url" required></label>
        <label>Local integration token<input id="token" type="password" required></label>
      </fieldset>

      <fieldset>
        <legend>Scanning</legend>
        <div class="form-grid">
          <label>Maximum Pins<input id="max-pins" type="number" min="1" max="10000" required></label>
          <label>Maximum duration (minutes)<input id="max-duration" type="number" min="1" max="60" required></label>
          <label>Rounds without new Pins<input id="no-new-rounds" type="number" min="1" max="20" required></label>
          <label>Wait between rounds (ms)<input id="wait-ms" type="number" min="250" max="10000" required></label>
          <label>Scroll ratio<input id="scroll-ratio" type="number" min="0.5" max="0.9" step="0.05" required></label>
        </div>
      </fieldset>

      <button class="button button-primary" type="submit">Save settings</button>
      <p id="message" class="message success" role="status"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
