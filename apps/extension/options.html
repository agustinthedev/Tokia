<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tokia settings</title><link rel="stylesheet" href="popup.css"></head>
<body class="options"><main><h1>Tokia settings</h1><form>
  <label>Backend URL<input id="backend-url" type="url" required></label>
  <label>Local integration token<input id="token" type="password" required></label>
  <label>Maximum Pins<input id="max-pins" type="number" min="1" max="10000" required></label>
  <label>Maximum scan duration (minutes)<input id="max-duration" type="number" min="1" max="60" required></label>
  <label>Rounds without new Pins<input id="no-new-rounds" type="number" min="1" max="20" required></label>
  <label>Wait between rounds (ms)<input id="wait-ms" type="number" min="250" max="10000" required></label>
  <label>Scroll ratio<input id="scroll-ratio" type="number" min="0.5" max="0.9" step="0.05" required></label>
  <button type="submit">Save settings</button><p id="message" class="success"></p>
</form></main><script src="options.js"></script></body></html>
