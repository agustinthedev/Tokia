<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tokia Importer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-copy"><strong>Tokia</strong><small>Local workspace</small></span>
      </div>
      <span class="eyebrow">Pinterest importer</span>
    </header>

    <section class="intro">
      <p class="eyebrow">Collection sync</p>
      <h1>Import Pinterest content</h1>
      <p>Scan the active board and send new Pins to Tokia.</p>
    </section>

    <div class="status-line">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="status">Detecting active tab...</span>
    </div>

    <section class="card">
      <div class="card-heading">
        <div>
          <span class="card-label">Active board</span>
          <strong id="board-title">Not detected</strong>
        </div>
        <span class="badge" id="board-badge">Waiting</span>
      </div>
      <div id="board-info" class="card-detail">Open a Pinterest board in the active tab.</div>
    </section>

    <section class="card progress-card">
      <div class="card-heading">
        <div>
          <span class="card-label">Scan progress</span>
          <strong id="progress">0 Pins</strong>
        </div>
        <span class="badge badge-blue">Live</span>
      </div>
      <div class="progress-track"><span id="progress-fill"></span></div>
    </section>

    <div class="actions">
      <button id="scan-visible" class="button button-primary" type="button">Scan visible Pins</button>
      <button id="scan-full" class="button button-primary" type="button">Scan entire board</button>
      <button id="stop-scan" class="button button-quiet" type="button">Stop scan</button>
      <button id="send" class="button button-primary" type="button">Send to Tokia</button>
    </div>

    <div class="utility-actions">
      <button id="test-connection" class="text-button" type="button">Test connection</button>
      <button id="settings" class="text-button" type="button">Open settings</button>
    </div>

    <p id="result" class="message success" role="status"></p>
    <p id="error" class="message error" role="alert"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
